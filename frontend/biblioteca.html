<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Biblioteca de ejercicios de calistenia: ejecución paso a paso, errores comunes, músculos, dificultad y progresión.">
  <title>Biblioteca | CaliCore</title>
  <meta name="color-scheme" content="light dark">
  <!-- Aplica el tema elegido ANTES de dibujar, para evitar un destello claro en modo oscuro (ver js/ui/theme.js) -->
  <script>
    try { const t = localStorage.getItem("calicore_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/pages/biblioteca.js"></script>
</head>
<!-- data-page indica qué página es: el menú lo usa para marcar el enlace activo -->
<body data-page="biblioteca">
  <main id="contenido" class="library">
    <section class="section library-head">
      <h1>Todos los ejercicios, explicados</h1>
      <p class="section-lead">Pasa el cursor (o toca) una tarjeta para ver de qué se trata, ábrela para leer su ficha completa y guarda con la estrella los que quieres dominar.</p>
    </section>

    <!-- Controles: los rellena y conecta js/features/library/index.js -->
    <section class="library-tools" aria-label="Buscar y filtrar ejercicios">
      <div class="tools-row">
        <label class="search">
          <span class="sr-only">Buscar ejercicio</span>
          <input id="lib-search" type="search" placeholder="Buscar: dominada, pino, tríceps…" autocomplete="off" aria-controls="lib-grid">
        </label>
        <label class="inline-select">Músculo <select id="lib-muscle" autocomplete="off"></select></label>
        <label class="inline-select">Equipamiento <select id="lib-equipment" autocomplete="off"></select></label>
        <label class="inline-select">Orden <select id="lib-sort" autocomplete="off"></select></label>
      </div>
      <div class="tools-row">
        <span class="tools-label" id="lbl-branch">Rama</span>
        <div id="lib-branches" class="chips" role="group" aria-labelledby="lbl-branch"></div>
      </div>
      <div class="tools-row">
        <span class="tools-label" id="lbl-difficulty">Dificultad</span>
        <div id="lib-difficulty" class="chips" role="group" aria-labelledby="lbl-difficulty"></div>
      </div>
      <div class="tools-row tools-footer">
        <p id="lib-count" class="lib-count" role="status"></p>
        <!-- data-user-only: solo se muestra con sesión iniciada -->
        <label class="switch" data-user-only hidden><input id="lib-favorites" type="checkbox"> Solo mis favoritos</label>
        <button id="lib-clear" class="btn btn-ghost" type="button" hidden>Limpiar filtros</button>
      </div>
      <p id="lib-status" class="lib-status" role="status"></p>
    </section>

    <section class="section library-results">
      <div id="lib-grid" class="card-grid"></div>
      <div id="lib-empty" class="lib-empty" hidden>
        <p>No hay ejercicios con esos filtros.</p>
        <button id="lib-empty-clear" class="btn" type="button">Limpiar filtros</button>
      </div>
    </section>
  </main>

  <!-- Ficha completa de un ejercicio. Su contenido lo dibuja js/features/library/detail.view.js -->
  <dialog id="exercise-dialog" class="detail-dialog" aria-labelledby="detail-title">
    <button id="detail-close" class="btn btn-ghost btn-icon detail-close" type="button" aria-label="Cerrar ficha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="detail-body" class="detail-body"></div>
  </dialog>
</body>
</html>
