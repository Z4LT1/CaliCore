<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="El árbol de la calistenia: de las raíces a la cima, cada camino de progresión en un solo mapa.">
  <title>Árbol | CaliCore</title>
  <meta name="color-scheme" content="light dark">
  <!-- Aplica el tema elegido ANTES de dibujar, para evitar un destello claro en modo oscuro (ver js/ui/theme.js) -->
  <script>
    try { const t = localStorage.getItem("calicore_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/pages/arbol.js"></script>
</head>
<!-- data-page indica qué página es: el menú lo usa para marcar el enlace activo -->
<body data-page="arbol">
  <main id="contenido" class="tree-page">

    <!-- ===================== ESCENARIO ===================== -->
    <!-- Capas de atrás hacia adelante. data-depth = cuánto acompañan a la cámara (parallax):
         1 se mueve igual que el árbol, menos de 1 queda "más lejos", más de 1 queda "más cerca".
         js/features/tree/index.js calcula la posición de cada una; aquí solo se declaran. -->
    <div id="tree-stage" class="tree-stage">
      <div class="layer" data-depth="0.35">
        <div class="world" id="world-fondo">
          <img class="world-img" id="img-fondo" src="assets/tree/fondo-1920.webp" alt="" decoding="async" fetchpriority="high">
          <div class="sun-rays" id="sun-rays" aria-hidden="true"></div>
        </div>
      </div>
      <div class="layer" data-depth="0.6"><div class="fog fog-back" id="fog-back" aria-hidden="true"></div></div>
      <div class="layer" data-depth="1">
        <div class="world" id="world-arbol">
          <img class="world-img tree-img" id="img-arbol" src="assets/tree/arbol-1920.webp" alt="" decoding="async" fetchpriority="high">
          <svg id="tree" class="tree-svg" viewBox="0 0 2000 1200" role="group" aria-label="Árbol de progresiones: zonas, caminos y ejercicios"></svg>
        </div>
      </div>
      <div class="layer" data-depth="1.2"><div class="fog fog-front" id="fog-front" aria-hidden="true"></div></div>
      <div class="vignette" aria-hidden="true"></div>
    </div>

    <!-- ===================== PANELES ===================== -->
    <!-- Lámina: título, dónde estás (migas) y las ramas -->
    <section class="paper tree-plaque" aria-labelledby="tree-title">
      <h1 id="tree-title">De las raíces a la cima</h1>
      <nav aria-label="Dónde estás en el árbol">
        <ol id="tree-crumbs" class="tree-crumbs"></ol>
      </nav>
      <p class="tree-hint">Haz clic en cualquier parte del árbol para recorrer esa rama. Con la rueda te acercas; arrastrando te mueves.</p>
      <div id="tree-branches" class="tree-branches" role="group" aria-label="Elegir una rama"></div>
    </section>

    <!-- Ficha breve del ejercicio elegido. Oculta hasta que se abre uno (js/features/tree/index.js) -->
    <aside id="tree-sheet" class="paper tree-sheet" aria-live="polite" hidden></aside>

    <div class="tree-controls" role="toolbar" aria-label="Controles del árbol">
      <button type="button" class="paper-btn" id="tree-zoom-in" aria-label="Acercar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="paper-btn" id="tree-zoom-out" aria-label="Alejar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button type="button" class="paper-btn paper-btn-text" id="tree-reset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        Árbol completo
      </button>
    </div>

    <p id="tree-status" class="sr-only" role="status"></p>
  </main>
</body>
</html>
